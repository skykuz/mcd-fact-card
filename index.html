<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麦当劳营养对比卡</title>
<style>
  :root{
    --bg:#F3EADA;
    --ink:#141110;
    --accent:#FF4A1C;
    --surface:#FFFDF7;
    --line:rgba(20,17,16,.10);
    --muted:rgba(20,17,16,.55);
    --track:rgba(20,17,16,.09);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",SimHei,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:32px 16px 56px;
    line-height:1.5;
  }
  .wrap{max-width:680px;margin:0 auto;}

  header{margin-bottom:22px;}
  h1{
    margin:0 0 6px;
    font-size:26px;
    letter-spacing:.5px;
    font-weight:800;
  }
  h1 em{font-style:normal;color:var(--accent);}
  .sub{margin:0;font-size:13px;color:var(--muted);}

  /* 选择器 */
  .picker{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 8px 24px rgba(20,17,16,.08);
    padding:18px;
    display:grid;
    grid-template-columns:1fr 44px 1fr;
    align-items:end;
    gap:12px;
  }
  .field{min-width:0;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
    letter-spacing:.5px;
  }
  .swap{
    height:42px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:10px;
    color:var(--ink);
    font-size:15px;
    cursor:pointer;
    font-family:inherit;
  }
  .swap{
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, color .18s ease;
  }
  .swap:hover{
    border-color:var(--accent);color:var(--accent);
    transform:translateY(-2px);box-shadow:0 6px 14px rgba(20,17,16,.18);
  }
  .swap:active{transform:translateY(0);}

  /* Tab 切换 */
  .tabs{display:flex;gap:8px;justify-content:center;margin-bottom:20px;}
  .tab{
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--muted);
    border-radius:999px;padding:9px 20px;
    font-size:14px;font-family:inherit;cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, color .18s ease, background .18s ease, border-color .18s ease;
  }
  .tab:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(20,17,16,.14);}
  .tab.is-active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  .view{animation:fadeUp .28s ease both;}

  /* 资产体检 */
  .panel{
    background:var(--surface);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 10px 26px rgba(20,17,16,.08);padding:18px 18px 16px;
  }
  .asset-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .sum-item{
    background:rgba(20,17,16,.04);border-radius:14px;padding:12px 14px;
    display:flex;flex-direction:column;gap:2px;
  }
  .sum-item.urgent{background:rgba(255,74,28,.10);}
  .sum-label{font-size:12px;color:var(--muted);}
  .sum-num{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
  .sum-item.urgent .sum-num{color:var(--accent);}
  .sum-item .unit{font-size:12px;color:var(--muted);}
  .asset-list{list-style:none;margin:0;padding:0;}
  .asset-list li{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;
    transition:transform .16s ease, background .16s ease;
  }
  .asset-list li:hover{background:rgba(20,17,16,.03);transform:translateX(2px);}
  .asset-list li.urgent{border-color:rgba(255,74,28,.45);background:rgba(255,74,28,.06);}
  .asset-list li.expired{opacity:.55;}
  .asset-name{font-size:14px;font-weight:700;}
  .asset-meta{font-size:11px;color:var(--muted);margin-top:2px;}
  .asset-left{font-size:13px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-left:6px;}
  .tag.urgent{background:var(--accent);color:#fff;font-weight:700;}
  .tag.expired{background:rgba(20,17,16,.12);color:var(--muted);}
  .tag.unknown{background:rgba(20,17,16,.08);color:var(--muted);}
  .share-btn.block{width:100%;margin:14px 0 0;padding:11px;border-radius:12px;font-size:14px;}
  .asset-empty{padding:24px;text-align:center;color:var(--muted);font-size:13px;}

  /* 榜单 */
  .rank-wrap{
    margin-top:22px;
    display:grid;grid-template-columns:1fr 1fr;gap:14px;
  }
  .rank{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 8px 22px rgba(20,17,16,.07);
    padding:16px 16px 12px;
  }
  .rank h3{margin:0 0 10px;font-size:14px;font-weight:800;letter-spacing:.5px;}
  .rank ol{margin:0;padding-left:18px;}
  .rank li{
    margin:9px 0;font-size:13px;padding:4px 6px;border-radius:8px;
    display:flex;flex-direction:column;gap:2px;
    transition:background .16s ease, transform .16s ease;
  }
  .rank li:hover{background:rgba(20,17,16,.05);transform:translateX(2px);}
  .rank li .line1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .rank li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank li .kc{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent);white-space:nowrap;}
  .rank li .sub{font-size:11px;color:var(--muted);}
  .rank.good li .kc{color:var(--ink);}

  /* 分享按钮 */
  .share-btn{
    margin-left:auto;
    border:1px solid var(--accent);
    background:var(--accent);
    color:#fff;
    border-radius:999px;
    padding:6px 14px;
    font-size:12px;font-weight:700;font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
  }
  .share-btn{
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .share-btn:hover:not([disabled]){
    background:#E03F14;
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(255,74,28,.38);
  }
  .share-btn:active:not([disabled]){transform:translateY(0);}
  .share-btn[disabled]{opacity:.45;cursor:not-allowed;background:var(--accent);}
  .share-hint{font-size:11px;color:var(--muted);margin:8px 20px 0;}

  /* 自写搜索下拉（无依赖） */
  .combo{position:relative;}
  .combo-input{
    width:100%;
    padding:11px 34px 11px 12px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    outline:none;
  }
  .combo-input:focus{border-color:var(--accent);}
  .combo-input::placeholder{color:rgba(20,17,16,.35);}
  .combo-clear{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;line-height:1;
    border:0;border-radius:50%;
    background:rgba(20,17,16,.08);
    color:var(--muted);
    font-size:14px;cursor:pointer;
    font-family:inherit;
    padding:0;
  }
  .combo-clear:hover{background:var(--accent);color:#fff;}

  /* 提示条 */
  .notice{
    margin-top:14px;
    font-size:12px;
    color:var(--muted);
    background:rgba(20,17,16,.05);
    border-left:3px solid var(--accent);
    border-radius:8px;
    padding:10px 12px;
  }
  .notice[hidden]{display:none;}

  /* 空态 */
  .empty{
    margin-top:18px;
    background:var(--surface);
    border:1px dashed var(--line);
    border-radius:16px;
    padding:38px 20px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }
  .empty[hidden]{display:none;}

  /* 对比卡 */
  .card{
    margin-top:18px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 12px 30px rgba(20,17,16,.10);
    overflow:hidden;
  }
  .card[hidden]{display:none;}
  .card.show{animation:fadeUp .3s ease both;}
  .metric{animation:fadeUp .34s ease both;}
  .metric:nth-child(2){animation-delay:.05s;}
  .metric:nth-child(3){animation-delay:.1s;}
  .card-head{
    padding:18px 20px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .card-head .vs{color:var(--accent);font-weight:800;font-size:13px;letter-spacing:1px;}
  .card-head .nameA,.card-head .nameB{font-size:19px;font-weight:800;}

  .metric{padding:16px 20px;border-bottom:1px solid var(--line);}
  .metric:last-child{border-bottom:0;}
  .metric-title{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:13px;color:var(--muted);letter-spacing:.5px;margin-bottom:10px;
  }
  .metric-title b{color:var(--ink);font-size:14px;font-weight:700;letter-spacing:0;}

  .row{display:grid;grid-template-columns:104px 1fr 96px;align-items:center;gap:10px;margin:6px 0;}
  .row .who{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .bar{height:10px;background:var(--track);border-radius:999px;overflow:hidden;}
  .row .bar i{display:block;height:100%;border-radius:999px;background:var(--ink);opacity:.72;transition:width .25s ease;}
  .row.hi .bar i{background:var(--accent);opacity:1;}
  .row .val{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;}
  .row.hi .val{font-weight:800;color:var(--accent);}

  .diff{
    margin-top:14px;
    background:rgba(255,74,28,.08);
    border-radius:12px;
    padding:12px 14px 11px;
    color:var(--ink);
  }
  .diff-lead{font-size:12px;color:var(--muted);letter-spacing:.3px;}
  .diff-num{
    display:flex;align-items:baseline;gap:5px;margin:2px 0 3px;
    animation:pop .3s ease both;
  }
  .diff-num b{
    font-size:34px;line-height:1;font-weight:800;
    color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.5px;
  }
  .diff-num .unit{font-size:13px;font-weight:700;color:var(--ink);opacity:.7;}
  .diff-txt{font-size:13px;color:var(--ink);opacity:.82;}
  /* 对比条：A 朱橙 / B 墨黑，纯 CSS 圆角 */
  .diff-bar{
    display:flex;height:10px;margin-top:10px;
    border-radius:999px;overflow:hidden;background:var(--track);
  }
  .diff-bar .ba{background:var(--accent);transition:width .35s ease;}
  .diff-bar .bb{background:var(--ink);opacity:.85;transition:width .35s ease;}
  .diff-legend{
    display:flex;justify-content:space-between;gap:10px;
    margin-top:6px;font-size:11px;color:var(--muted);
  }
  .diff-legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .diff-legend .la{color:var(--accent);font-weight:700;}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96);}to{opacity:1;transform:none;}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  footer{margin-top:18px;font-size:11px;color:var(--muted);text-align:center;}

  @media (max-width:680px){
    .rank-wrap{grid-template-columns:1fr;}
  }
  @media (max-width:560px){
    .asset-summary{grid-template-columns:1fr;}
    .sum-num{font-size:26px;}
    .tabs{gap:6px;}
    .tab{padding:8px 14px;font-size:13px;}
    .asset-list li{flex-direction:column;align-items:flex-start;gap:6px;}
    .asset-left{text-align:left;}
  }
  @media (max-width:560px){
    body{padding:20px 12px 40px;}
    h1{font-size:22px;}
    .picker{grid-template-columns:1fr;align-items:stretch;gap:10px;}
    .swap{height:38px;width:100%;}
    .row{grid-template-columns:76px 1fr 78px;}
    .row .who{font-size:12px;}
    .row .val{font-size:12px;}
    .card-head{padding:14px 14px;}
    .card-head .nameA,.card-head .nameB{font-size:16px;}
    .share-btn{width:100%;margin:8px 0 0;text-align:center;}
    .metric{padding:14px;}
    .diff{padding:11px 12px 10px;}
    .diff-num b{font-size:30px;}
    .diff-legend{font-size:10px;gap:6px;}
    .empty{padding:30px 16px;font-size:13px;}
    .rank{padding:14px 12px 10px;}
    .rank li .sub{font-size:10px;}
  }
  @media (max-width:375px){
    .row{grid-template-columns:64px 1fr 70px;}
    .diff-num b{font-size:27px;}
    .combo-input{font-size:14px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>麦当劳 <em>营养对比卡</em></h1>
    <p class="sub">输入关键词（如「堡」「鸡」「可乐」）快速筛选，选两个餐品看清真实差距。</p>
  </header>

  <div class="tabs">
    <button class="tab is-active" id="tabCompare" type="button">&#127829; 营养对比</button>
    <button class="tab" id="tabAssets" type="button">&#9201;&#65039; 资产体检</button>
  </div>

  <section id="viewCompare" class="view">
  <div class="picker">
    <div class="field">
      <label for="inputA">餐品 A</label>
      <div class="combo">
        <input id="inputA" class="combo-input" type="text" list="menuList" autocomplete="off" spellcheck="false"
               placeholder="输入关键词，如：堡、鸡">
        <button class="combo-clear" id="clearA" type="button" title="清除">&#215;</button>
      </div>
    </div>
    <button class="swap" id="swap" type="button" title="交换 A / B">&#8646;</button>
    <div class="field">
      <label for="inputB">餐品 B</label>
      <div class="combo">
        <input id="inputB" class="combo-input" type="text" list="menuList" autocomplete="off" spellcheck="false"
               placeholder="输入关键词，如：堡、鸡">
        <button class="combo-clear" id="clearB" type="button" title="清除">&#215;</button>
      </div>
    </div>
  </div>
  <datalist id="menuList"></datalist>

  <div class="notice" id="notice" hidden></div>

  <div class="empty" id="empty">请选择两个<strong>不同</strong>的餐品，对比结果会显示在这里。</div>

  <section class="card" id="card" hidden>
    <div class="card-head">
      <span class="nameA" id="nameA"></span>
      <span class="vs">VS</span>
      <span class="nameB" id="nameB"></span>
      <button class="share-btn" id="shareBtn" type="button" disabled>生成图片</button>
    </div>
    <div id="metrics"></div>
    <p class="share-hint" id="shareHint" hidden></p>
  </section>

  <div class="rank-wrap">
    <div class="rank hot">
      <h3>&#128293; 热量刺客 Top 5</h3>
      <ol id="rankHot"></ol>
    </div>
    <div class="rank good">
      <h3>&#127793; 减脂红榜 Top 5</h3>
      <ol id="rankGood"></ol>
    </div>
  </div>

  </section>

  <section id="viewAssets" class="view" hidden>
    <div class="panel">
      <div class="asset-summary">
        <div class="sum-item">
          <span class="sum-label">当前总资产估值</span>
          <span class="sum-num" id="sumTotal">--</span>
          <span class="unit">元（按面值与数量折算）</span>
        </div>
        <div class="sum-item urgent">
          <span class="sum-label">24 小时内即将流失</span>
          <span class="sum-num" id="sumLoss">--</span>
          <span class="unit" id="sumLossUnit">元</span>
        </div>
      </div>
      <ul class="asset-list" id="assetList"></ul>
      <button class="share-btn block" id="reportBtn" type="button">生成体检报告</button>
      <p class="share-hint" id="reportHint" hidden></p>
    </div>
  </section>

  <footer>换算口径：热量 15 大卡 ≈ 爬 1 层楼 ｜ 蛋白质 6 克 ≈ 1 个鸡蛋 ｜ 钠按毫克→克换算</footer>

</div>

            catch (e) { reject(e); }

  /* 时间戳解析：任何异常都返回 null（渲染为"未知时间"），绝不抛错白屏 */
  function parseExpire(v) {
    if (v === null || v === undefined || v === "") return null;
    var t = null;
    if (typeof v === "number") {
      t = v;
    } else if (typeof v === "string") {
      var n = Number(v);
      if (v.trim() !== "" && !isNaN(n)) t = n;
      else {
        var d = Date.parse(v);
        t = isNaN(d) ? null : d;
      }
    }
    if (t === null || !isFinite(t) || t <= 0) return null;
    if (t < 1e12) t = t * 1000;      // 兼容秒级时间戳
    return t;
  }

  function normalizeAssets(data) {
    var raw = (data && data.items) ? data.items : data;
    if (!raw || !raw.length) return [];
    return raw.filter(function (it) { return it && it.id && it.name; }).map(function (it) {
      return {
        id: String(it.id),
        name: String(it.name),
        face: Number(it.face) || 0,
        unit: it.unit ? String(it.unit) : "",
        count: Number(it.count) || 1,
        estimate: Number(it.estimate) || 0,
        expireAt: parseExpire(it.expireAt)   // 解析失败 → null
      };
    });
  }

  function leftMs(it, now) { return it.expireAt === null ? null : it.expireAt - now; }

  /* 排序：未过期（越紧急越靠前）→ 已过期（越近越靠前）→ 未知时间 */
  function sortAssets(list, now) {
    function rank(it) {
      var ms = leftMs(it, now);
      return ms === null ? 2 : (ms <= 0 ? 1 : 0);
    }
    return list.slice().sort(function (x, y) {
      var rx = rank(x), ry = rank(y);
      if (rx !== ry) return rx - ry;
      var lx = leftMs(x, now), ly = leftMs(y, now);
      if (lx === null || ly === null) return 0;
      return rx === 1 ? (ly - lx) : (lx - ly);
    });
  }

    var h = ms / 3600000;
    if (h < 1) return Math.max(1, Math.round(ms / 60000)) + " 分钟";
    if (h < 24) return (Math.round(h * 10) / 10) + " 小时";
    // 先取整到小时再拆分，否则会出现"2 天 24 小时"这种进位丢失的显示
    var th = Math.round(h);

     否则会出现"输入框有名字、数据却是上一项"的错位。 */
  function sync(which) {
    var v = (which === "A" ? inputA : inputB).value.trim();
    var it = findByName(v);
    sel[which] = it ? it.id : null;
    render();
  }

  /* ---------- 榜单：直接读数据按卡路里排序 ---------- */
  function fillRank(id, arr) {
    var ol = document.getElementById(id);
    clear(ol);
    arr.forEach(function (it) {
      var li = document.createElement("li");
      var line1 = el("div", "line1");
      line1.appendChild(el("span", "nm", it.name));
      line1.appendChild(el("span", "kc", it.calories + " 大卡"));
      li.appendChild(line1);
      li.appendChild(el("div", "sub",
        "蛋白 " + it.protein + " g ／ 钠 " + it.sodium + " mg"));
      ol.appendChild(li);
    });
  }
  function renderRank() {
    if (!ITEMS.length) return;
    var byCal = ITEMS.slice().sort(function (x, y) { return y.calories - x.calories; });
    fillRank("rankHot", byCal.slice(0, 5));           // 热量最高的 5 条（降序）
    fillRank("rankGood", byCal.slice(-5).reverse());  // 热量最低的 5 条（升序）
  }

  /* ---------- 分享：Canvas 手绘对比卡 → 导出 PNG（严禁外部库） ---------- */
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawBar(ctx, x, y, w, h, ratio, isHigh) {
    ctx.fillStyle = "rgba(20,17,16,.09)";
    roundRect(ctx, x, y, w, h, h / 2); ctx.fill();
    ctx.fillStyle = isHigh ? "#FF4A1C" : "rgba(20,17,16,.72)";
    var ww = Math.max(w * ratio, h);
    roundRect(ctx, x, y, Math.min(ww, w), h, h / 2); ctx.fill();
  }
  function drawRow(ctx, L, R, y, name, v, m, isHigh, max, FONT) {
    ctx.fillStyle = "rgba(20,17,16,.55)";
    ctx.font = "13px " + FONT;
    ctx.fillText(name, L, y);
    var bx = L + 190, bw = R - bx - 96;
    drawBar(ctx, bx, y - 9, bw, 10, v / max, isHigh);
    ctx.fillStyle = isHigh ? "#FF4A1C" : "#141110";
    ctx.font = (isHigh ? "800 " : "") + "13px " + FONT;
    ctx.textAlign = "right";
    ctx.fillText(v + " " + m.unit, R, y);
    ctx.textAlign = "left";
  }

  function exportPNG() {
    var a = findItem(sel.A), b = findItem(sel.B);
    if (!a || !b || a.id === b.id) return;

    var W = 700, H = 920, DPR = 2;
    var FONT = '"Microsoft YaHei","PingFang SC",SimHei,sans-serif';
    var cv = document.createElement("canvas");
    cv.width = W * DPR;
    cv.height = H * DPR;
    var ctx = cv.getContext("2d");
    ctx.scale(DPR, DPR);

    // 纸色底 + 卡片
    ctx.fillStyle = "#F3EADA";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#FFFDF7";
    roundRect(ctx, 24, 24, W - 48, H - 48, 20);
    ctx.fill();

    var L = 56, R = W - 56;

    // 标题
    ctx.fillStyle = "#141110";
    ctx.font = "800 26px " + FONT;
    ctx.fillText("麦当劳 营养对比卡", L, 86);
    ctx.fillStyle = "#FF4A1C";
    ctx.font = "800 14px " + FONT;
    ctx.fillText("热量 / 蛋白质 / 钠 真实差距", L, 112);

    // A VS B（过长自动缩字号）
    var head = a.name + "   VS   " + b.name;
    var size = 22;
    ctx.font = "800 " + size + "px " + FONT;
    while (ctx.measureText(head).width > (R - L) && size > 12) {
      size -= 1;
      ctx.font = "800 " + size + "px " + FONT;
    }
    ctx.fillStyle = "#141110";
    ctx.fillText(head, L, 152);

    // 三项指标
    var y = 196;
    METRICS.forEach(function (m) {
      var va = a[m.key], vb = b[m.key];
      var max = Math.max(va, vb, 1);
      var diff = va - vb, ad = Math.abs(diff);

      ctx.fillStyle = "#141110";
      ctx.font = "800 15px " + FONT;
      ctx.fillText(m.label + "（单位：" + m.unit + "）", L, y);
      y += 26;

      drawRow(ctx, L, R, y, a.name, va, m, diff > 0, max, FONT); y += 30;
      drawRow(ctx, L, R, y, b.name, vb, m, diff < 0, max, FONT); y += 30;

      // 差值：lead + 特大数字 + 情绪文案 + 对比条 + 图例（与页面同源）
      var hi = diff > 0 ? a : b, lo = diff > 0 ? b : a;
      ctx.fillStyle = "rgba(255,74,28,.08)";
      roundRect(ctx, L - 12, y - 16, R - L + 24, 152, 12);
      ctx.fill();

      ctx.fillStyle = "rgba(20,17,16,.55)";
      ctx.font = "12px " + FONT;
      ctx.fillText(hi.name + " 比 " + lo.name + " 高出", L, y);
      y += 40;

      var bigTxt = ad === 0 ? "0" : num(ad);
      ctx.fillStyle = "#FF4A1C";
      ctx.font = "800 34px " + FONT;
      ctx.fillText(bigTxt, L, y);
      var nw = ctx.measureText(bigTxt).width;
      ctx.fillStyle = "#141110";
      ctx.font = "700 13px " + FONT;
      ctx.fillText(" " + m.diffUnit, L + nw + 5, y);
      y += 22;

      ctx.fillStyle = "rgba(20,17,16,.78)";
      ctx.font = "13px " + FONT;
      ctx.fillText(ad === 0 ? "谁也没赢，这局平手" : emotionText(m, ad), L, y);
      y += 22;

      var total = va + vb;
      var pa = total > 0 ? (va / total) : 0.5;
      var bw = R - L;
      if (pa >= 0.995) {                 // 一方占比 100% 时只画一段，避免 1px 突刺
        ctx.fillStyle = pa >= 0.5 ? "#FF4A1C" : "rgba(20,17,16,.85)";
        roundRect(ctx, L, y, bw, 10, 5); ctx.fill();
      } else {
        ctx.fillStyle = "#FF4A1C";
        roundRect(ctx, L, y, bw * pa, 10, 5); ctx.fill();
        ctx.fillStyle = "rgba(20,17,16,.85)";
        roundRect(ctx, L + bw * pa, y, bw * (1 - pa), 10, 5); ctx.fill();
      }
      y += 22;

      ctx.font = "11px " + FONT;
      ctx.fillStyle = "#FF4A1C";
      ctx.fillText(a.name + " " + Math.round(pa * 100) + "%", L, y);
      ctx.textAlign = "right";
      ctx.fillStyle = "rgba(20,17,16,.6)";
      ctx.fillText(b.name + " " + Math.round((1 - pa) * 100) + "%", R, y);
      ctx.textAlign = "left";
      y += 34;
    });

    // 页脚口径
    ctx.fillStyle = "rgba(20,17,16,.55)";
    ctx.font = "11px " + FONT;
    ctx.fillText("热量 15 大卡 ≈ 1 层楼 ｜ 蛋白质 6 克 ≈ 1 个鸡蛋 ｜ 钠 按毫克→克换算", L, H - 48);
    ctx.textAlign = "right";
    ctx.fillText("mcd-fact-card", R, H - 48);
    ctx.textAlign = "left";

    // 导出（canvas 未绘制外部图片，不会污染画布，file:// 下也可导出）
    try {
      var url = cv.toDataURL("image/png");
      if (!url || url.indexOf("data:image/png") !== 0) throw new Error("toDataURL 返回为空");
      var link = document.createElement("a");
      link.href = url;
      link.download = "mcd-fact-card_" + a.name + "_VS_" + b.name + ".png";
      link.id = "downloadLink";
      document.body.appendChild(link);   // 挂到 DOM，便于自动化测试断言
      link.click();
      document.body.removeChild(link);
      shareHint.textContent = "已生成 PNG（" + (url.length / 1024).toFixed(0) + " KB），正在下载…";
      shareHint.hidden = false;
    } catch (e) {
      shareHint.textContent = "生成失败：" + e.message;
      shareHint.hidden = false;
    }
  }

  /* ---------- 渲染对比卡 ---------- */

  /* 情绪化换算文案：数值 + 网感表达，页面与导出图共用同一函数，避免两处说法不一致 */
  function emotionText(m, ad) {
    if (m.key === "calories") {
      var f = num(ad / 15);
      if (ad >= 300) return "相当于爬 " + f + " 层楼，帕梅拉白跳了";
      if (ad >= 150) return "相当于爬 " + f + " 层楼，得走半小时才还清";
      return "相当于爬 " + f + " 层楼，小意思";
    }
    if (m.key === "protein") {
      var e = num(ad / 6);
      if (ad >= 15) return "≈ " + e + " 个鸡蛋，这顿肉真没白吃";
      if (ad >= 6) return "≈ " + e + " 个鸡蛋，差距不算大";
      return "≈ " + e + " 个鸡蛋，基本打平";
    }
    var g = num(ad / 1000, 2);
    if (ad >= 800) return "换算 ≈ " + g + " 克，钠含量直接爆表";
    if (ad >= 400) return "换算 ≈ " + g + " 克，钠有点多，明天多喝水";
    return "换算 ≈ " + g + " 克，差距可控";
  }
  function metricBlock(m, a, b) {
    var va = a[m.key], vb = b[m.key];
    var diff = va - vb;                 // 正 = A 更高
    var ad = Math.abs(diff);
    var max = Math.max(va, vb, 1);

    var wrap = el("div", "metric");

    var title = el("div", "metric-title");
    title.appendChild(el("b", null, m.label));
    title.appendChild(el("span", null, "单位：" + m.unit));
    wrap.appendChild(title);

    // A 行
    var ra = el("div", "row" + (diff > 0 ? " hi" : ""));
    ra.appendChild(el("div", "who", a.name));
    var ba = el("div", "bar"); var ia = el("i");
    ia.style.width = Math.max(4, (va / max) * 100).toFixed(1) + "%";
    ba.appendChild(ia); ra.appendChild(ba);
    ra.appendChild(el("div", "val", num(va) + " " + m.unit));
    wrap.appendChild(ra);

    // B 行
    var rb = el("div", "row" + (diff < 0 ? " hi" : ""));
    rb.appendChild(el("div", "who", b.name));
    var bb = el("div", "bar"); var ib = el("i");
    ib.style.width = Math.max(4, (vb / max) * 100).toFixed(1) + "%";
    bb.appendChild(ib); rb.appendChild(bb);
    rb.appendChild(el("div", "val", num(vb) + " " + m.unit));
    wrap.appendChild(rb);

    // 差值：大数字 + 小单位 + 情绪化换算 + A/B 对比条
    var d = el("div", "diff");

    if (ad === 0) {
      d.appendChild(el("div", "diff-lead", "两者持平"));
      var z = el("div", "diff-num");
      z.appendChild(el("b", null, "0"));
      z.appendChild(el("span", "unit", m.diffUnit));
      d.appendChild(z);
      d.appendChild(el("div", "diff-txt", "谁也没赢，这局平手"));
      wrap.appendChild(d);
      return wrap;
    }

    // 主语固定为「数值更高的那一方」，动词固定为「高出」，避免出现"A 比 B 低 X"的反向误读
    var higher = diff > 0 ? a : b;
    var lower = diff > 0 ? b : a;

    d.appendChild(el("div", "diff-lead", higher.name + " 比 " + lower.name + " 高出"));

    var dn = el("div", "diff-num");
    dn.appendChild(el("b", null, num(ad)));
    dn.appendChild(el("span", "unit", m.diffUnit));
    d.appendChild(dn);

    d.appendChild(el("div", "diff-txt", emotionText(m, ad)));

    // 对比条：A 朱橙 / B 墨黑，按两者占比切分
    var total = va + vb;
    var pa = total > 0 ? (va / total * 100) : 50;
    var pb = total > 0 ? (vb / total * 100) : 50;
    var dbar = el("div", "diff-bar");
    var sa = el("i", "ba"); sa.style.width = pa.toFixed(1) + "%";
    var sb = el("i", "bb"); sb.style.width = pb.toFixed(1) + "%";
    dbar.appendChild(sa); dbar.appendChild(sb);
    d.appendChild(dbar);

    var lg = el("div", "diff-legend");
    lg.appendChild(el("span", "la", a.name + " " + pa.toFixed(0) + "%"));
    lg.appendChild(el("span", "lb", b.name + " " + pb.toFixed(0) + "%"));
    d.appendChild(lg);

    wrap.appendChild(d);
    return wrap;
  }

  function render() {
    var a = findItem(sel.A);
    var b = findItem(sel.B);
    shareBtn.disabled = !(a && b && a.id !== b.id);
    if (shareBtn.disabled) shareHint.hidden = true;

    if (!a || !b || a.id === b.id) {
      cardEl.hidden = true;
      emptyEl.hidden = false;
      return;
    }
    emptyEl.hidden = true;
    cardEl.hidden = false;
    // 重新触发淡入动画（hidden 切换不会自动重放 animation）
    cardEl.classList.remove("show");
    void cardEl.offsetWidth;
    cardEl.classList.add("show");

    nameAEl.textContent = a.name;
    nameBEl.textContent = b.name;

    clear(metricsEl);
    METRICS.forEach(function (m) { metricsEl.appendChild(metricBlock(m, a, b)); });
  }

  /* ---------- Tab 切换 ---------- */
  var tabCompare = document.getElementById("tabCompare");
  var tabAssets = document.getElementById("tabAssets");
  var viewCompare = document.getElementById("viewCompare");
  var viewAssets = document.getElementById("viewAssets");

  function switchView(which) {
    var isCmp = which === "compare";
    viewCompare.hidden = !isCmp;
    viewAssets.hidden = isCmp;
    tabCompare.className = "tab" + (isCmp ? " is-active" : "");
    tabAssets.className = "tab" + (isCmp ? "" : " is-active");
    var v = isCmp ? viewCompare : viewAssets;
    v.classList.remove("view"); void v.offsetWidth; v.classList.add("view");
  }
  tabCompare.addEventListener("click", function () { switchView("compare"); });
  tabAssets.addEventListener("click", function () { switchView("assets"); });
  document.getElementById("reportBtn").addEventListener("click", exportReport);

  /* ---------- 启动 ---------- */
  inputA.addEventListener("input", function () { sync("A"); });
  inputB.addEventListener("input", function () { sync("B"); });
  document.getElementById("clearA").addEventListener("click", function () {
    inputA.value = ""; sync("A"); inputA.focus();
  });
  document.getElementById("clearB").addEventListener("click", function () {
    inputB.value = ""; sync("B"); inputB.focus();
  });
  shareBtn.addEventListener("click", exportPNG);

  swapBtn.addEventListener("click", function () {
    var ta = inputA.value, tb = inputB.value;
    inputA.value = tb;
    inputB.value = ta;
    sync("A"); sync("B");
  });

  loadMenu().then(function (result) {
    ITEMS = result.items;
    fillDatalist();
    renderRank();
    if (result.fallback) {
      showNotice("提示：当前为本地直接打开（file://），浏览器安全策略拦截了 menu.json 的读取，" +
                 "已自动使用内置的同源数据（" + ITEMS.length + " 条）。如需读取 menu.json，请在本目录执行 " +
                 "python -m http.server 后通过 http://localhost:8000 访问。");
    }
    render();
  });

  loadAssets().then(function (r) {
    ASSETS = r.items;
    renderAssets();
  });
})();
</script>
</body>
</html>
